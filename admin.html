<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>FORM INDEX 管理后台</title>
  <script src="./config.js?v=20261125"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#f4f5f7;--panel:#fff;--ink:#191b1f;--muted:#6e747d;--line:#e1e4e8;--brand:#ff4500;--blue:#1677d2;--green:#18794e;--red:#b42318;--shadow:0 16px 50px rgba(25,27,31,.08)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select{font:inherit}
    button{cursor:pointer}
    [hidden]{display:none!important}
    .shell{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}
    .side{background:#17191d;color:#fff;padding:24px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:18px}
    .mark{width:34px;height:34px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-size:12px}
    .side-label{margin:32px 8px 8px;color:#818791;font-size:10px;letter-spacing:.14em;font-weight:800}
    .nav{padding:9px 10px;border-radius:7px;background:#292d33;font-weight:700}
    .side-foot{margin-top:auto;color:#a7adb6;font-size:12px;word-break:break-word}
    .side-foot button{margin-top:12px;width:100%}
    .main{padding:28px 32px 48px;min-width:0}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
    h1{font-size:28px;letter-spacing:-.04em;margin:0}
    .sub{color:var(--muted);margin:6px 0 0}
    .live-link{color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#ffe8dd 0,transparent 32%),radial-gradient(circle at 90% 80%,#dcecff 0,transparent 30%),#f4f5f7}
    .login{width:min(440px,100%);padding:30px}
    .login h1{font-size:26px}
    .field{margin-top:16px}
    .field label{display:block;font-weight:700;font-size:12px;margin-bottom:6px}
    .field input{width:100%;border:1px solid #cfd4da;border-radius:8px;padding:11px 12px;outline:none;background:#fff}
    .field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1677d21a}
    .btn{border:1px solid transparent;border-radius:8px;padding:9px 14px;font-weight:750;background:var(--blue);color:#fff}
    .btn:hover{filter:brightness(.96)}
    .btn.secondary{background:#fff;color:#2f353d;border-color:#cfd4da}
    .btn.danger{background:#fff;color:var(--red);border-color:#efc6c1}
    .btn.success{background:#fff;color:var(--green);border-color:#b8dfcb}
    .btn.small{padding:5px 9px;font-size:12px}
    .btn.wide{width:100%;margin-top:18px;padding:11px}
    .error{margin-top:14px;padding:10px 12px;border-radius:8px;background:#fff0ee;color:var(--red);font-size:13px}
    .notice{padding:12px 14px;border:1px solid #b8dfcb;background:#effaf4;border-radius:8px;color:var(--green)}
    .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
    .stat{padding:18px}
    .stat span{display:block;color:var(--muted);font-size:12px;font-weight:700}
    .stat strong{display:block;font-size:28px;line-height:1.15;margin-top:6px;letter-spacing:-.04em}
    .toolbar{display:flex;gap:10px;align-items:center;padding:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .tabs{display:inline-flex;background:#eef0f3;border-radius:8px;padding:3px}
    .tab{border:0;background:transparent;padding:7px 13px;border-radius:6px;color:#616871;font-weight:700}
    .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px #00000014}
    .search{flex:1;min-width:180px;border:1px solid #d8dce1;border-radius:8px;padding:8px 10px;outline:none}
    select{border:1px solid #d8dce1;border-radius:8px;padding:8px 10px;background:#fff}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;background:#fafbfc;color:#747b84;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;border-bottom:1px solid var(--line)}
    td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
    tr:last-child td{border-bottom:0}
    .title-cell{min-width:240px}
    .title-cell b{display:block;max-width:520px;line-height:1.35}
    .title-cell small,.meta{display:block;color:var(--muted);font-size:12px;margin-top:4px}
    .status{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase}
    .status.published{background:#e8f7ef;color:#18794e}
    .status.hidden{background:#fff4db;color:#8a5a00}
    .status.removed{background:#feeceb;color:#b42318}
    .actions{display:flex;gap:6px;flex-wrap:wrap;min-width:130px}
    .empty{padding:48px 20px;text-align:center;color:var(--muted)}
    .loading{padding:60px 20px;text-align:center;color:var(--muted)}
    .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#17191d;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:10}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:static;padding:14px 18px;flex-direction:row;align-items:center}.side-label,.nav{display:none}.side-foot{margin:0 0 0 auto;max-width:50%}.main{padding:20px 14px 40px}.stats{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.toolbar>*{width:100%}.tabs{width:100%}.tab{flex:1}.top{flex-direction:column}.side-foot{max-width:65%}}
  </style>
</head>
<body>
  <section class="login-wrap" id="loginView">
    <div class="panel login">
      <div class="brand"><span class="mark">FI</span>FORM INDEX</div>
      <h1>管理后台</h1>
      <p class="sub">仅限已授权的管理员账号登录。</p>
      <form id="loginForm">
        <div class="field">
          <label for="email">管理员邮箱</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
        </div>
        <div class="error" id="loginError" hidden></div>
        <button class="btn wide" id="loginButton" type="submit">登录后台</button>
      </form>
      <p class="sub" id="accessHint"></p>
    </div>
  </section>

  <div class="shell" id="adminView" hidden>
    <aside class="side">
      <div class="brand"><span class="mark">FI</span>FORM INDEX</div>
      <div class="side-label">管理</div>
      <div class="nav">内容审核</div>
      <div class="side-foot">
        <div id="adminIdentity"></div>
        <button class="btn secondary small" id="logoutButton">退出登录</button>
      </div>
    </aside>

    <main class="main">
      <div class="top">
        <div>
          <h1>社区管理</h1>
          <p class="sub">审核帖子与评论，隐藏违规内容或恢复公开状态。</p>
        </div>
        <a class="live-link" href="https://lllaf.com/" target="_blank" rel="noopener">打开线上社区 ↗</a>
      </div>

      <div class="stats">
        <div class="panel stat"><span>全部帖子</span><strong id="statPosts">—</strong></div>
        <div class="panel stat"><span>已发布帖子</span><strong id="statPublished">—</strong></div>
        <div class="panel stat"><span>已隐藏帖子</span><strong id="statHidden">—</strong></div>
        <div class="panel stat"><span>全部评论</span><strong id="statComments">—</strong></div>
        <div class="panel stat"><span>店铺评价</span><strong id="statReviews">—</strong></div>
      </div>

      <section class="panel">
        <div class="toolbar">
          <div class="tabs" role="tablist">
            <button class="tab active" data-view="posts">帖子</button>
            <button class="tab" data-view="comments">评论</button>
            <button class="tab" data-view="reviews">店铺评价</button>
          </div>
          <input class="search" id="searchInput" type="search" placeholder="搜索标题、正文或作者">
          <select id="statusFilter" aria-label="内容状态">
            <option value="">全部状态</option>
            <option value="published">已发布</option>
            <option value="hidden">已隐藏</option>
            <option value="removed">已移除</option>
          </select>
          <button class="btn secondary small" id="refreshButton">刷新</button>
        </div>
        <div id="loading" class="loading">正在读取社区内容…</div>
        <div class="table-wrap" id="tableWrap" hidden>
          <table>
            <thead>
              <tr>
                <th>内容</th>
                <th>作者</th>
                <th>状态</th>
                <th>时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="contentRows"></tbody>
          </table>
        </div>
        <div class="empty" id="emptyState" hidden>没有符合条件的内容。</div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="./admin.js?v=20261125reviews"></script>
</body>
</html>
